[mouse]
# # Если true (по умолчанию), перетаскивание края или угла окна изменяет его размер через
# # невидимую границу изменения размера (рамка SSD или край CSD). Установите false, чтобы сделать эту
# # границу инертной — изменение размера только через явные привязки (например, alt+right) или
# # жесты.
# resize_on_border = true

# # Если true, изменение размера окна путем перетаскивания его края (рамка SSD или CSD)
# # распространяется на каждое окно, соединенное с ним через прилипание.
# # Изменение размера через привязки/жесты не затрагивается — явно привяжите `resize-window-snapped`,
# # если хотите изменение размера с учетом кластера и там.
# decoration_resize_snapped = false

# # Если true, максимизация/восстанов Maximization initiated via window decoration (кнопка максимизации CSD,
# # двойной клик по заголовку SSD или xdg/foreign-toplevel set_maximized)
# # распространяется на каждое окно, соединенное через прилипание.
# # Fit через привязки/жесты не затрагивается — явно привяжите `fit-window-snapped`,
# # если хотите fit с учетом кластера и там.
# decoration_fit_snapped = false

# # Привязки мыши: "Modifier+...+Trigger" = "action"
# # Контекстно-зависимые: on-window (на окне), on-canvas (на холсте), anywhere (везде).
# # Сначала проверяется конкретный контекст, затем "anywhere" как запасной вариант.
# # Клик для фокуса и клики по декорациям SSD всегда жестко закодированы.
# # Триггеры: left, right, middle (кнопки), trackpad-scroll, wheel-scroll,
# # wheel-up, wheel-down. Триггеры wheel-up/wheel-down срабатывают один раз за
# # дискретный щелчок колеса и могут выполнять любое действие, например, регулировку громкости при mod+shift+scroll.
# # Объединяется с настройками по умолчанию. Используйте "none" для отвязки.
# #
# # Действия мыши: move-window, move-snapped-windows, resize-window,
# # resize-window-snapped, pan-viewport, zoom, center-nearest
# # Любое действие с клавиатуры также работает для триггеров кнопок: exec, close-window, toggle-fullscreen и т.д.
# #
# # move-window / resize-window действуют только на сфокусированное окно.
# # move-snapped-windows / resize-window-snapped также перемещают каждое окно,
# # соединенное с сфокусированным через прилипание

[mouse.on-window]
# "alt+left" = "move-window"
# "alt+shift+left" = "move-snapped-windows"
# "alt+right" = "resize-window"
# "alt+shift+right" = "resize-window-snapped"
# "alt+middle" = "fit-window"
# "alt+shift+middle" = "fit-window-snapped"
# "mod+middle" = "toggle-fullscreen"

[mouse.on-canvas]
# "left" = "pan-viewport"            # обычный левый клик по пустому холсту → панорамирование
# "trackpad-scroll" = "pan-viewport" # прокрутка тачпада по пустому холсту → панорамирование
# "wheel-scroll" = "zoom"            # колесо мыши по пустому холсту → масштабирование

[mouse.anywhere]
# "mod+left" = "pan-viewport"
# "mod+ctrl+left" = "center-nearest" # направление определяется дельтой перетаскивания
# "mod+trackpad-scroll" = "pan-viewport"
# "mod+wheel-scroll" = "zoom"

[gestures]
# # Пороги жестов — настройте под размер вашего тачпада.
# swipe_threshold = 12.0        # накопленное расстояние в пикселях до срабатывания направленного свайпа
# pinch_in_threshold = 0.85     # масштаб, ниже которого срабатывает сведение пальцев (1.0 = нет сведения)
# pinch_out_threshold = 1.15    # масштаб, выше которого срабатывает разведение пальцев (1.0 = нет разведения)

# # Привязки жестов: "Modifier+N-finger-<type>" = "action"
# # Контекстно-зависимые: on-window, on-canvas, anywhere.
# # Несвязанные жесты передаются сфокусированному приложению.
# # "none" отвязывает (предотвращает fallback на anywhere, все еще передает приложению).
# #
# # Типы жестов:
# #   N-finger-swipe            — непрерывный ИЛИ пороговый (действие определяет поведение)
# #   N-finger-swipe-up/down/left/right — только пороговый, проверяется перед fallback на swipe
# #   3-finger-doubletap-swipe  — непрерывный ИЛИ пороговый (касание 3 пальцами, затем свайп)
# #   N-finger-pinch            — только непрерывный (используйте pinch-in/out для дискретных)
# #   N-finger-pinch-in/out     — только пороговый
# #   N-finger-hold             — только пороговый (срабатывает при отпускании)
# #
# # Непрерывные действия: pan-viewport, zoom, move-window, resize-window, resize-window-snapped
# # Пороговые действия: center-nearest, center-window, home-toggle, zoom-to-fit, zoom-to-fit-snapped, fit-window, fit-window-snapped, exec <cmd> и т.д.

[gestures.on-window]
# "alt+3-finger-swipe" = "resize-window"
# "alt+shift+3-finger-swipe" = "resize-window-snapped"
# "3-finger-doubletap-swipe" = "move-window"
# "alt+2-finger-pinch-in" = "fit-window"
# "alt+2-finger-pinch-out" = "fit-window"
# "alt+shift+2-finger-pinch-in" = "fit-window-snapped"
# "alt+shift+2-finger-pinch-out" = "fit-window-snapped"
# "alt+3-finger-pinch-in" = "toggle-fullscreen"
# "alt+3-finger-pinch-out" = "toggle-fullscreen"

[gestures.on-canvas]
# "2-finger-pinch" = "zoom"

[gestures.anywhere]
# "3-finger-swipe" = "pan-viewport"         # непрерывный (dx/dy за кадр)
# "4-finger-swipe" = "center-nearest"       # пороговый (накопление, определение направления, однократное срабатывание)
# "mod+3-finger-swipe" = "center-nearest"   # mod заставляет 3-пальцевый свайп тоже навигировать
# # Пример: переопределения по направлениям (только пороговые, проверяются перед fallback на swipe)
# # "4-finger-swipe-up" = "exec brightnessctl set +5%"
# # "4-finger-swipe-down" = "exec brightnessctl set 5%-"
# "mod+2-finger-pinch" = "zoom"             # mod переопределяет передачу приложению
# "3-finger-pinch" = "zoom"                 # непрерывный
# "4-finger-pinch-in" = "zoom-to-fit"       # пороговый
# "mod+4-finger-pinch-in" = "zoom-to-fit-snapped"
# "4-finger-pinch-out" = "home-toggle"      # пороговый
# "mod+3-finger-pinch-in" = "zoom-to-fit"
# "mod+3-finger-pinch-out" = "home-toggle"
# "4-finger-hold" = "center-window"         # срабатывает при отпускании
# "mod+3-finger-hold" = "center-window"

[xwayland]
# # Поддержка X11 через xwayland-satellite. driftwm eagerly запускает satellite at
# # startup, экспортирует DISPLAY=:N, и приложения X11 подключаются прозрачно. Если binary
# # не найден, поддержка X11 отключается с предупреждением; everything
# # else still runs.
# enabled = true                  # по умолчанию: true
# path    = "xwayland-satellite"  # путь к binary xwayland-satellite (работает поиск через $PATH)

[backend]
# # Особенности стабильности оборудования. Все по умолчанию false (opt-in).
# # Включите их, если испытываете мерцание, сбои или проблемы с рендерингом.
# # Особенно полезно на GPU NVIDIA с проприетарными драйверами.
# # Примечание: Эти флаги должны быть установлены перед запуском driftwm. Их изменение требует перезапуска.
# # Для дополнительных настроек, специфичных для NVIDIA, установите these environment variables in your
# # session wrapper script or shell profile before starting driftwm:
# #   export SMITHAY_USE_LEGACY=1          # Use legacy DRM API instead of atomic modesetting
# #   export __GL_GSYNC_ALLOWED=0
# #   export __GL_VRR_ALLOWED=0
# #   export __GL_MaxFramesAllowed=1
# #   export NVD_BACKEND=direct
# wait_for_frame_completion = false  # Force GPU-fence wait before every page flip
                                     # (already done automatically when smithay reports
                                     # needs_sync — typical case on NVIDIA. Set true
                                     # only if you still see flicker after defaults.)
# disable_direct_scanout = false     # Force EGL composition (disable direct scanout)
# disable_hardware_cursor = false    # Composite the cursor into the frame instead of
                                     # using the KMS cursor plane, while keeping direct
                                     # scanout for fullscreen apps. Fixes a stuttering /
                                     # tearing hardware cursor on discrete NVIDIA GPUs.
# max_capture_fps = 0                # Cap FPS delivered to continuous screen-capture
                                     # clients (recorders / casts). 0 = unlimited. Each
                                     # captured frame forces a full-scene re-composite
                                     # that competes with a fullscreen app behind it; a
                                     # cap (e.g. 30 or 60) trims that overhead while
                                     # gaming + streaming. One-shot screenshots (grim)
                                     # are never throttled.

[output.outline]
# color = "#ffffff"           # цвет контура для видовых областей других мониторов
# thickness = 1               # пиксели (0 чтобы отключить)
# opacity = 0.5               # 0.0–1.0

# ## Мониторы (Outputs)
# # Конфигурация для каждого монитора. Каждая запись [[outputs]] сопоставляется по имени коннектора.
# # Найдите имена коннекторов с помощью wlr-randr или проверьте логи driftwm при запуске.
# # Мониторы без совпадающей записи по умолчанию имеют масштаб 1.0.
# # Бэкенд Winit игнорирует entries [[outputs]].
# #
# # `mode` принимает "preferred", "WxH" или "WxH@Hz". Bare "WxH" только selects a
# # mode the monitor already advertises — if none matches, it keeps the preferred
# # mode (logged as a warning, not an error). "WxH@Hz" forces that exact mode,
# # synthesizing a CVT modeline when the monitor doesn't advertise it (intended
# # for CRTs or forcing non-standard modes; may be rejected by some panels).
# #
# # Пример:
# # [[outputs]]
# # name = "eDP-1"           # имя коннектора (обязательно)
# # scale = 1.5              # fractional scale (по умолчанию: 1.0)
# # transform = "normal"     # normal, 90, 180, 270, flipped, flipped-90, flipped-180, flipped-270
# # position = "auto"        # "auto" (слева-направо) или [x, y] в координатах layout
# # mode = "preferred"       # "preferred", "1920x1080" или "2560x1440@144"
# #
# # [[outputs]]
# # name = "HDMI-A-1"
# # scale = 1.0
# # mode = "1920x1080@60"

# ## Правила окон
# # Правила окон: сопоставляют окна и применяют переопределения для каждого окна.
# # ВСЕ совпадающие правила объединяются в порядке конфигурации (поздние правила переопределяют ранние
# # для скалярных полей; boolean flags are sticky-on). This lets you compose
# # rules — e.g. one rule sets blur=true, a later one adds opacity=0.85.
# #
# # Критерии сопоставления (требуется хотя бы один; all specified must match):
# #   app_id     — Wayland app_id. Приложения X11, проксируемые через xwayland-satellite, прибывают
# #                с app_id, установленным из WM_CLASS instance (обычно в нижнем регистре).
# #   title      — заголовок окна
# #
# # Синтаксис шаблонов (применяется ко всем полям сопоставления):
# #   Plain string  — точное совпадение: "kitty"
# #   Glob          — wildcard *:  "steam_app_*"
# #   Regex         — обернуть в /…/: "/^steam_app_\\d+$/"
# #
# # Чтобы найти идентификаторы окна, выполните while the window is open:
# #   `driftwm msg state`
# #
# # Поля эффектов:
# #   position   — координаты [x, y] (центр окна, Y-up). Координаты холста, или
# #                относительно монитора (начало = центр монитора), когда pinned_to_screen.
# #   size       — [width, height] начальные размеры окна (one-shot; user/app can resize after)
# #   widget     — true: закреплено (неподвижно), below normal windows, excluded from
# #                navigation and alt-tab (по умолчанию: false)
# #   pinned_to_screen — true: lock the window to the output's screen space —
# #                ignores pan/zoom, floats above normal windows (PiP, toolbars).
# #                `position` becomes output-relative; movable unless widget = true.
# #                Toggle live with `toggle-pin-to-screen` (Mod+T). (по умолчанию: false)
# #   decoration — overrides [decorations] default_mode for matched windows.
# #                Omit to inherit default_mode. Values:
# #                "client":  CSD — client's own titlebar
# #                "server":  SSD — driftwm's titlebar
# #                "minimal": SSD — no titlebar, just shadow + corners + border
# #                            (this is the mode for chrome-on-borderless widgets;
# #                            border_width / corner_radius / shadow rules apply)
# #                "none":    bare client surface — compositor adds zero chrome,
# #                            and per-window border_width / corner_radius /
# #                            shadow rules are ignored. Use "minimal" if you
# #                            want chrome without a titlebar.
# #   blur       — true: blur background behind this window (по умолчанию: false)
# #   opacity    — 0.0–1.0: transparency окна (по умолчанию: 1.0, fully opaque)
# #   border_width         — per-window border width override (px). Set to 0 to
# #                          disable border on a window even when [decorations]
# #                          border_width > 0. Ignored for decoration = "none".
# #   border_color         — per-window unfocused border color hex (e.g. "#5c5c5c").
# #   border_color_focused — per-window focused border color hex.
# #   corner_radius        — per-window corner radius override (px). Affects
# #                          content clip, border shape, and shadow. Ignored for
# #                          decoration = "none".
# #   shadow               — per-window shadow toggle. Overrides [decorations]
# #                          shadow. Ignored for decoration = "none".
# #   output     — output name (e.g. "DP-1") this window fullscreens onto. Takes
# #                precedence over the output the client itself requests. Omit to
# #                honor the client's request, then the active output. Find names
# #                under `outputs.*` in `driftwm msg state`. (по умолчанию: unset)
# #   pass_keys  — controls which compositor keybindings are forwarded to the app:
# #                  pass_keys = true — forward ALL keys (game-friendly)
# #                  pass_keys = ["mod+q", "ctrl+q"] — forward ONLY these combos; all other compositor shortcuts stay active
# #                  pass_keys = false / omit — compositor handles everything (по умолчанию)
# #                  VT switching (Ctrl+Alt+F1–F12) — always stays in the compositor
# #
# # Layer-shell surfaces (panels, notifications, bars like waybar):
# # `decoration` is ignored — layers have no decoration mode. Chrome
# # (border_width, corner_radius, shadow) is field-by-field opt-in on the rule
# # and does NOT inherit from [decorations]. Without explicit values on the
# # rule, a layer surface has no border, no shadow, and no corner clip.
# #
# # Пример: Desktop widget (pinned clock/calendar)
# # [[window_rules]]
# # app_id     = "my-widget"
# # position   = [0, 0]
# # widget     = true
# # decoration = "none"
# #
# # Пример: Picture-in-Picture, pinned to the screen, stays put while you pan/zoom
# # [[window_rules]]
# # title            = "Picture-in-Picture"
# # pinned_to_screen = true
# # position         = [0, -300]   # output-relative: 300px below center; movable, drop to center on the output
# #
# # Пример: Blurred transparent terminal
# # [[window_rules]]
# # app_id  = "kitty"
# # opacity = 0.85
# # blur    = true
# #
# # Пример: Game, pass ALL keys to the app (mod+q, ctrl+q etc. reach the game)
# # [[window_rules]]
# # app_id    = "steam_app_*"
# # pass_keys = true
# #
# # Пример: Game, only let ctrl+q through, keep everything else (mod+q still closes)
