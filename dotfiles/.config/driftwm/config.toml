# # Конфигурация driftwm

# # Этот файл документирует все встроенные значения по умолчанию.
# #
# # Строка вида "# key = value" — это активное значение по умолчанию.
# # Раскомментируйте её (удалите ведущий "# "), чтобы переопределить это значение.
# # Строки, начинающиеся с "# #", являются описаниями и примерами, они никогда
# # не становятся активной конфигурацией; значения под заголовком "# # Example:"
# # являются иллюстративными альтернативами, а не значениями по умолчанию.
# #
# # Для настройки: скопируйте этот файл в ~/.config/driftwm/config.toml
# # и отредактируйте только те строки, которые хотите изменить.
# # Отсутствующие поля будут использовать встроенные значения по умолчанию.
# # Для привязок клавиш используйте = "none", чтобы полностью удалить привязку по умолчанию.
# # Проверьте конфигуляцию командой: driftwm --check-config

# ## Общие настройки
# # Клавиша-модификатор оконного менеджера: "super" (по умолчанию) или "alt"
mod_key = "super"

# # Навязчивый фокус (Sloppy focus): фокус клавиатуры следует за указателем мыши.
# # Перемещение на пустое пространство сохраняет фокус; кликните по пустому пространству, чтобы снять фокус.
# focus_follows_mouse = false

# # Где появляются новые окна, если правило окна не задает их позицию:
# #   "center"  — центр видимой области; камера анимируется к новому окну.
# #   "cursor"  — центрируется относительно курсора (с ограничением по рабочей области
# #               активного монитора); камера остается на месте, если не уменьшено масштабирование
# #               и zoom.reset_on_new_window равно true.
# #   "auto"    — автоматически размещается рядом с кластером сфокусированного окна:
# #               пытается найти место у краев сфокусированного окна (по часовой стрелке, начиная с ближайшего
# #               к центру видимой области), затем использует поиск в ширину (BFS) к соседям.
# #               Возвращается к "center", если нет сфокусированного окна или не найдено valid размещение.
window_placement = "auto"

# # Команды для запуска при старте (после установки WAYLAND_DISPLAY).
# # Каждая запись передается в sh -c, поэтому работает полный синтаксис оболочки (конвейеры, &&, переменные окружения).
autostart = ["waybar"]
# #
# # Запуск driftwm как сеанса systemd (через driftwm-session или менеджер дисплея)
# # также запускает элементы автозапуска XDG (~/.config/autostart, /etc/xdg/autostart)
# # в дополнение к списку autostart выше. Чтобы отключить это:
# #   systemctl --user mask xdg-desktop-autostart.target

[env]
# # Переменные окружения, устанавливаемые перед запуском любых клиентов.
# # Дочерние процессы (autostart, exec-привязки) наследуют их.
# # Они переопределяют встроенные значения по умолчанию для инструментов композитора
# # (MOZ_ENABLE_WAYLAND, QT_QPA_PLATFORM, SDL_VIDEODRIVER, GDK_BACKEND, ELECTRON_OZONE_PLATFORM_HINT).
# # Пример:
# # QT_WAYLAND_DISABLE_WINDOWDECORATION = "1"
# # MOZ_ENABLE_WAYLAND = "1"

[input.keyboard]
layout = "fi"              # Раскладка XKB (например, "us,ru" для нескольких раскладок)
# remember_layout_per_window = false  # для настроек с несколькими раскладками
# variant = ""               # Вариант XKB (например, "dvorak" или "," для двух вариантов по умолчанию)
# options = ""               # Опции XKB (например, "grp:win_space_toggle" для переключения раскладки по Super+Space)
                             #   grp:alt_shift_toggle/grp:ctrl_shift_toggle ломают эти комбинации клавиш — вместо них используйте tap-привязку (см. [keybindings])
# model = ""                 # Модель клавиатуры XKB (например, "pc105")
# repeat_rate = 25           # повторений в секунду
# repeat_delay = 200         # мс до начала повтора
# layout_independent = true  # сопоставлять привязки по физической позиции клавиши независимо от раскладки
# num_lock = true            # состояние Num Lock при запуске
# caps_lock = false          # состояние Caps Lock при запуске

[input.trackpad]
# tap_to_click = true         # включить нажатие для клика
# natural_scroll = true       # инвертировать направление прокрутки (контент следует за пальцами)
# tap_and_drag = true         # двойное касание с удержанием для перетаскивания
# accel_speed = 0.0           # ускорение указателя (от -1.0 до 1.0)
# accel_profile = "adaptive"  # "flat" (плоское) или "adaptive" (адаптивное)
# click_method = "none"       # none = по умолчанию устройства; clickfinger = количество пальцев (1=левый, 2=правый, 3=средний); button_areas = зона на тачпаде
# disable_while_typing = true  # игнорировать ввод с тачпада shortly после нажатия клавиши (защита от случайных касаний ладонью)

[input.mouse]
# accel_speed = 0.0           # ускорение указателя (от -1.0 до 1.0)
# accel_profile = "flat"      # "flat" (плоское) или "adaptive" (адаптивное)
# natural_scroll = false      # инвертировать направление прокрутки

# [input.touch]
# enable = true               # включить поддержку сенсорного экрана
# map_to_output = "none"      # привязать сенсорный ввод к монитору по имени коннектора;
                              # "none" (по умолчанию) автоматически определяет сенсорный экран по
                              # физическому размеру + коннектору. Устанавливайте это только чтобы различать
                              # два сенсорных экрана одинакового размера.
# # Пример:
# # map_to_output = "DP-2"

[cursor]
theme = "Moga-Neon-Purple"     # Тема курсора XCURSOR_THEME; "none" = наследовать из окружения (например, "Adwaita")
size = 30                      # Размер курсора XCURSOR_SIZE; 0 = наследовать из окружения (например, 24)
inactive_opacity = 1           # прозрачность курсора на неактивных мониторах (0.0–1.0)

[navigation]
trackpad_speed = 1.5        # множитель скорости панорамирования для тачпада (прокрутка/жесты)
# mouse_speed = 1.0           # множитель скорости панорамирования для мыши (перетаскивание) (1.0 = напрямую)
# touch_speed = 1.0           # множитель скорости панорами gestures для сенсорного экрана
# drift = 0.5                 # инерция движения: 0 = выкл, 0.5 = по умолчанию, 1 = максимальная плавучесть
# animation_speed = 0.3       # коэффициент линейной интерполяции камеры (чем выше, тем быстрее)
# auto_navigate_on_close = true  # при закрытии окна панорамировать к новому сфокусированному окну, если оно за экраном
                              # false = камера остается на месте; фокус переходит только на видимое окно
# nudge_step = 20             # пикселей за одно действие сдвига окна (по умолчанию mod-shift-стрелки)
# pan_step = 100.0            # пикселей за одно действие панорамирования вида (по умолчанию mod-ctrl-стрелки)
# # Якоря: точки на холсте, обнаруживаемые по ближайшему центру (свайп 4 пальцами / Mod+Стрелки)
# # даже если там нет окна. Используется система координат Y-up (Y направлена вверх).
# anchors = [[0, 0]]
# # Пример: 4 угла
# # anchors = [[0, 0], [-1750, 1750], [1750, 1750], [1750, -1750], [-1750, -1750]]

[navigation.edge_pan]
# zone = 100.0                # ширина зоны активации (пиксели от края видимой области)
# speed_min = 4.0             # пикселей/кадр на границе зоны
# speed_max = 10.0            # пикселей/кадр у края видимой области
# cursor_pan = false          # панорамирование, когда просто курсор касается края экрана
                              # (не только во время перетаскивания). Переключатель: "toggle-cursor-pan".
# cursor_zone = 20.0          # зона активации панорамирования курсором у края (пиксели) — сделана маленькой,
                              # чтобы не срабатывать случайно.
                              # Панорамирует с постоянной скоростью speed_max внутри зоны (стабильно,
                              # независимо от скорости pushing); speed_min здесь не используется.

[zoom]
# step = 1.1                  # множитель за одно нажатие клавиши (1.1 = 10% за нажатие)
# trackpad_speed = 1.0        # множитель скорости масштабирования сведением пальцев на тачпаде
# mouse_speed = 1.0           # множитель скорости масштабирования колесом мыши
# touch_speed = 1.0           # множитель скорости жестов масштабирования на сенсорном экране
# fit_padding = 80.0          # отступ в пикселях видимой области для масштабирования "вписать" (пространство экрана)
# reset_on_new_window = true  # анимировать масштаб至 1.0 при появлении нового окна
                              # (false = сохранить текущий масштаб, только панорамировать)
# reset_on_activation = true  # анимировать масштаб至 1.0, когда окно за пределами экрана
                              # запрашивает фокус
                              # (false = сохранить текущий масштаб, только панорамировать)

[snap]
# enabled = true               # магнитное прилипание к краям при перетаскивании окна
# gap = 12.0                   # зазор между прилипшими окнами (пиксели холста)
# distance = 24.0              # порог активации (пиксели экрана от края)
# break_force = 32.0           # пиксели экрана, чтобы оторваться от прилипания
# corners = false              # также выравнивать углы (параллельные края выравниваются: верх-к-верху, лево-к-леву)
# centers = false              # также выравнивать центры (средние точки выравниваются по оси перемещения)

[decorations]
# bg_color = "#303030"           # фон заголовка (по умолчанию: темно-серый)
# fg_color = "#FFFFFF"           # цвет текста заголовка + кнопки закрытия × (по умолчанию: белый)
# corner_radius = 10             # радиус скругления углов окна
# shadow = true                  # тень под декорациями окна

# # Текст заголовка SSD (Server-Side Decorations). Шрифт определяется через fontconfig — установите
# # пакет `adwaita-fonts` для внешнего вида по умолчанию; иначе будет использован generic sans.
# title_bar_height = 25          # высота заголовка SSD в пикселях (по умолчанию: 25)
# font = "Adwaita Sans"          # семейство шрифтов текста заголовка
# font_size = 11                 # размер шрифта заголовка в пунктах (по умолчанию: 11)
# font_weight = "medium"         # thin/extralight/light/regular/medium/
                                 # semibold/bold/extrabold/black (по умолчанию: medium)
# title_align = "center"         # "left" или "center" (по умолчанию: center). "center"
                                 # центрирует короткие заголовки и выравнивает по левому краю +
                                 # добавляет многоточие для длинных

# # Режим декораций для окон без правила:
# #   "client"  — CSD: клиент рисует свой собственный заголовок (по умолчанию)
# #   "minimal" — SSD: без заголовка; тень, углы и рамка все еще применяются через [decorations] + правила для окон
# #   "none"    — чистая поверхность клиента: композитор не добавляет никаких элементов; правила рамки/углов/тени для отдельных окон игнорируются
# # "server" (заголовок driftwm) намеренно не разрешен как глобальное значение по умолчанию: многие тулкиты (GTK, Electron)
# # игнорируют xdg-decoration и продолжают рисовать CSD, создавая смещенный двойной заголовок. Используйте его для конкретных приложений через
# # [[window_rules]].
# default_mode = "client"

# # Рамки применяются к режимам "client", "server" и "minimal". Режим "none" не имеет
# # рамки, если она не установлена для конкретного приложения в [[window_rules]].
# border_width = 0               # пиксели; 0 отключает рамку
# border_color = "#303030"       # рамка неактивного окна (по умолчанию: темно-серый)
# border_color_focused = "#303030"  # рамка активного окна. По умолчанию такая же, как выше —
                                    # установите другой цвет, чтобы получить индикатор фокуса.

[effects]
# blur_radius = 2                # количество проходов down+up алгоритма Kawase (по умолчанию: 2)
# blur_strength = 1.1            # разброс текселей за проход (по умолчанию: 1.1)
# animate_blur_fps = 20          # частота обновления размытия под анимированными обоями (0-144, по умолчанию
                                 # 20; 0 = выкл, замораживает эффект матового стекла, чтобы он перестал повторно сэмплировать
                                 # обои). Фон размывается один раз в общую тексту全长ого вывода,
                                 # и каждое окно вырезает свой прямоугольник из нее, поэтому нагрузка остается постоянной
                                 # при добавлении окон; окно, находящееся поверх других окон, возвращается
                                 # к точному поблочному размытию с той же частотой. Анимированные обои
                                 # меняются медленно, поэтому частота значительно ниже частоты обновления монитора все еще выглядит непрерывной
                                 # сквозь матовое стекло. Движения камеры форсируют обновление.

[background]
# # Пять типов: "default" (встроенная сетка точек — по умолчанию), "shader", "tile",
# # "wallpaper", "none". Для shader/tile/wallpaper, `path` является источником.
type = "wallpaper"
path = "~/.wallpaper/bg0.jpg" 
# # Пример:
# # type = "shader"  # процедурный GLSL (прокручивается вместе с холстом)
# # path = "/usr/local/share/driftwm/wallpapers/animated/fast_smoke.glsl"
# #
# # type = "tile"  # изображение, повторяемое по всему холсту
# # path = "~/Pictures/Wallpapers/tile.png"
# #
# # type = "wallpaper"  # одиночное изображение, закрепленное в видимой области (не прокручивается/не масштабируется)
# # path = "~/Pictures/Wallpapers/wallpaper.jpg"
# #
# # type = "none"  # не рендерить встроенный фон (path игнорируется), так что
# #                # демон обоев wlr-layer-shell (swaybg, swww, mpvpaper для live video)
# #                # становится обоями. Запустите его самостоятельно; см. docs/shaders.md.

# # "shader" также может сэмплировать изображение через `texture` (привязано к
# # сэмплеру `tex` шейдера) — процедурный эффект *на* вашем изображении. См. docs/shaders.md.
# # Пример: шейдер, сэмплирующий изображение
# # type = "shader"
# # path = "/usr/local/share/driftwm/wallpapers/textured/ripple.glsl"
# # texture = "~/Pictures/Wallpapers/photo.jpg"

# # Только для режима tile: зеркальное отражение изображения (блок 2×2 с отражением), чтобы края
# # несвязного изображения всегда стыковались с отражением — не видно швов плитки. Также дает
# # калейдоскопический/симметричный вид. Не влияет на другие типы фона. Только для одиночных изображений;
# # гигапиксельные пирамидальные TIFF не отражаются (отразите источник заранее).
# mirror_tile = false

# # Запечь тяжелый статический шейдер в текстуру один раз, а затем панорамировать её — так он панорамируется
# # так же дешево, как изображение, вместо пересчета каждый кадр.
# # CORRECT только для шейдеров, которые жестко скользят вместе с камерой: u_camera используется
# # один раз, в полном масштабе, как единственный термин камеры. В GLSL:
# #     vec2 canvas = v_coords * size + u_camera;   // панорамирование сдвигает изображение 1:1
# # Параллакс (u_camera * factor) отрендерится НЕПРАВИЛЬНО; анимированные (u_time) и
# # зависящие от зума (u_zoom) шейдеры никогда не кэшируются и рендерятся в реальном времени.
# cache_shader = false
# # Учитывать альфа-канал вывода шейдера, чтобы прозрачные пиксели показывали то, что находится
# # под фоном — например, поверхность Background wlr-layer-shell от внешнего движка обоев.
# # Форсирует шейдер на живой путь рендеринга, поэтому
# # cache_shader не действует, пока эта опция включена. Фоновые изображения игнорируют её:
# # tile/wallpaper PNG с альфа-каналом становятся прозрачными автоматически.
# # См. docs/shaders.md.
# transparent_shader = false
# # Потолок памяти (МБ), общий для cache_shader и обоев gigapixel-TIFF,
# # с вытеснением LRU (Least Recently Used). Увеличьте для более четкого отображения при повторных обращениях
# # на больших / HiDPI дисплеях; уменьшите на машинах с ограниченной памятью (слишком низкое значение
# # просто сделает фон более размытым).
# cache_budget_mb = 128

# [bindings]
# # Отказаться от встроенных привязок по умолчанию по категориям, чтобы начать с чистого листа.
# # Обычно ваши записи в [keybindings]/[mouse]/[gestures] объединяются со
# # встроенными (используйте `= "none"` для удаления одной конкретной привязки). Перечисление категории
# # здесь удаляет ВСЕ привязки по умолчанию этой категории, оставляя только ваши собственные.
# # Категории: "keys", "mouse", "gestures".
# disable_defaults = []
# # Пример: использовать свою схему клавиатуры, сохранить привязки мыши и жестов по умолчанию
# # disable_defaults = ["keys"]

[keybindings]
# # Привязки клавиатуры: "Modifier+...+Keysym" = "action [arg]"
# # Объединяется с настройками по умолчанию. Используйте "none" для отвязки.
# # "mod" раскрывается в mod_key. Литеральные модификаторы: alt, super, ctrl, shift.
# # Keysym — имена XKB (без учета регистра): return, tab, up, a, equal и т.д.
# # Чистая комбинация модификаторов (например, "alt+shift") является tap-привязкой (срабатывает при отпускании комбинации; см. [input.keyboard] options).
# #
# # Действия:
# #   exec <cmd>              — запустить приложение (показывает курсор загрузки до появления окна, выходит из полноэкранного режима)
# #   exec-terminal           — запустить автоматически определенный терминал (см. [keybindings] ниже; переопределите через $TERMINAL)
# #   exec-launcher           — запустить автоматически определенную панель запуска приложений (см. [keybindings] ниже; переопределите через $LAUNCHER)
# #   spawn <cmd>             — выполнить команду без курсора загрузки и выхода из полноэкранного режима (переключатели, OSD, скриншоты)
# #   close-window            — закрыть сфокусированное окно
# #   nudge-window <dir>      — сдвинуть сфокусированное окно на nudge_step пикселей
# #   pan-viewport <dir>      — панорамировать камеру на pan_step пикселей
# #   center-window           — центрировать вид на сфокусированном окне + сбросить масштаб
# #   focus-center            — сфокусироваться + центрировать на окне под указателем + сбросить масштаб
# #   center-nearest <dir>    — перейти к ближайшему окну в направлении
# #   cycle-windows forward   — циклическое переключение окон в стиле Alt-Tab
# #   cycle-windows backward  — обратное циклическое переключение
# #   home-toggle             — переключение между текущей позицией и началом координат
# #   zoom-in / zoom-out      — шаг масштабирования
# #   zoom-reset              — масштаб至 1.0
# #   go-to <x> <y>           — переместить камеру в позицию на холсте (закладки, Y-up)
# #   zoom-to-fit             — вписать все окна в видимую область
# #   zoom-to-fit-snapped     — вписать только кластер прилипания сфокусированного окна
# #   toggle-fullscreen       — переключить полноэкранный режим сфокусированного окна
# #   fit-window              — переключить максимизацию: центрирует + сбрасывает масштаб + заполняет видимую область; восстановление только изменяет размер обратно
# #   fit-window-snapped      — fit-window для всего кластера прилипания сфокусированного окна
# #   toggle-pin-to-screen    — закрепить/открепить сфокусированное окно к экрану (игнорирует панорамирование/масштаб, плавает поверх)
# #   reload-config           — горячая перезагрузка файла конфигурации
# #   toggle-cursor-pan       — переключить панорамирование курсором у края (см. [navigation.edge_pan])
# #   quit                    — выйти из композитора
# #   send-to-output <dir>    — переместить сфокусированное окно на соседний монитор
# #   send-cursor-to-output <dir>  — переместить курсор на соседний монитор
# #   switch-layout <target>  — циклическое переключение раскладки клавиатуры: next, prev или индекс с 0
# #   none                    — отвязать эту комбинацию клавиш
# #
# # Направления: up, down, left, right, up-left, up-right, down-left, down-right
"mod+escape"= "quit"
"mod+return" = "exec kitty"
"mod+space" = "exec rofi -show drun"
"mod+q" = "close-window"
